<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd4e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .heart-background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float-up 8s infinite;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: white;
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            max-width: 500px;
            animation: slide-in 1s ease-out;
        }

        @keyframes slide-in {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .big-heart {
            font-size: 80px;
            animation: pulse 1.5s infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 2.5em;
            color: #ff1493;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
        }

        .message {
            font-size: 1.2em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1493 100%);
            color: white;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.4);
        }

        .no-btn {
            background: #f0f0f0;
            color: #999;
            font-size: 0.9em;
        }

        .no-btn:hover {
            transform: scale(0.9);
        }

        .celebration {
            display: none;
            animation: celebrate 0.5s ease-out;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .celebration h2 {
            font-size: 2.5em;
            color: #ff1493;
            margin-bottom: 20px;
        }

        .celebration p {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 15px;
        }

        .hearts-explosion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .exploding-heart {
            position: absolute;
            font-size: 30px;
            animation: explode 2s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        .love-note {
            background: #fff5f8;
            padding: 20px;
            border-radius: 15px;
            margin-top: 60px;
            /* border-left: 4px solid #ff1493; */
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="heart-background" id="heartBackground"></div>
    
    <div class="container">
        <div id="question">
            <div class="big-heart">💕</div>
            <h1>Will You Be My Valentine?</h1>
            <p class="message">
                Every moment I spent with you... shined!
            </p>
            <div class="button-container">
                <button class="yes-btn" onclick="sayYes()">Yes!</button>
                <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
            </div>
            <div class="love-note">
                <strong>P.S.</strong> I know you won't say no, but just in case...
            </div>
        </div>

        <div class="celebration" id="celebration">
            <div class="big-heart">💝</div>
            <h2>Yaaay!</h2>
            <p>I can't wait to celebrate this Valentine's Day with you!</p>
            <div class="love-note" style="margin-top: 30px;">
                Forever yours,<br>
                Your loving fiancé 🤍
            </div>
        </div>
    </div>

    <script>
        // Create floating hearts in background
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 3 + 's';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
            document.getElementById('heartBackground').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 10000);
        }

        // Create hearts continuously
        setInterval(createFloatingHeart, 500);

        // Move the No button away when hovering
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            const maxX = containerRect.width - noBtn.offsetWidth - 100;
            const maxY = containerRect.height - noBtn.offsetHeight - 100;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // When Yes is clicked
        function sayYes() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            
            // Create heart explosion
            createHeartExplosion();
        }

        function createHeartExplosion() {
            const container = document.querySelector('.container');
            const explosionContainer = document.createElement('div');
            explosionContainer.className = 'hearts-explosion';
            container.appendChild(explosionContainer);
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'exploding-heart';
                heart.innerHTML = ['❤️', '💕', '💖', '💝'][Math.floor(Math.random() * 4)];
                
                const angle = (Math.PI * 2 * i) / 20;
                const distance = 200 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                heart.style.setProperty('--tx', tx + 'px');
                heart.style.setProperty('--ty', ty + 'px');
                heart.style.animationDelay = (Math.random() * 0.3) + 's';
                
                explosionContainer.appendChild(heart);
            }
            
            setTimeout(() => {
                explosionContainer.remove();
            }, 2500);
        }
    </script>
</body>
</html>
